[package]
name = "visiongrep"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
description = "Semantic image search for local folders, scripts and AI agents, using CLIP locally"
license = "MIT"
repository = "https://github.com/udayj/visiongrep"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
indicatif = "0.18"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
rayon = "1.12"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
walkdir = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary", "CFNumber", "CFString", "CFURL", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["CGImageProperties", "CGImageSource", "objc2-core-graphics"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

# Release archives built by `dist` use the same settings as local release builds.
[profile.dist]
inherits = "release"

# `publish = false` would otherwise hide the binary from the dist release workflow.
[package.metadata.dist]
dist = true
