name: Apple Silicon Core ML experiment

on:
  workflow_dispatch:
    inputs:
      corpus_size:
        description: Pinned COCO validation images
        required: true
        default: "500"
      repetitions:
        description: End-to-end repetitions
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  coreml:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MODEL_CACHE: ${{ github.workspace }}/.coreml-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yurijmikhalevich/rclip
          ref: v3.3.0
          path: .benchmark-rclip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE }}
          key: coreml-9103b327-cba4faed-3f7e6f94-ee267cd6
      - name: Require real Apple Silicon
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          system_profiler SPHardwareDataType
      - name: Install pinned rclip environment
        run: |
          test "$(git -C .benchmark-rclip rev-parse HEAD)" = 3dcec2de5e23311473f6fb6433e602aa4f4ca812
          python -m pip install uv==0.11.12
          uv sync --project .benchmark-rclip --frozen --no-dev --python 3.12
      - name: Download and verify CPU and Core ML artifacts
        run: |
          PACKAGE="$MODEL_CACHE/visual.mlpackage"
          mkdir -p "$PACKAGE/Data/com.apple.CoreML/weights"
          download() { if [ ! -f "$1" ]; then curl -L --fail --retry 5 --retry-all-errors -o "$1" "$2"; fi; }
          download "$MODEL_CACHE/visual.onnx" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.onnx
          download "$MODEL_CACHE/textual.onnx" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/textual.onnx
          download "$MODEL_CACHE/bpe_simple_vocab_16e6.txt.gz" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/tokenizer/bpe_simple_vocab_16e6.txt.gz
          download "$PACKAGE/Data/com.apple.CoreML/model.mlmodel" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.mlpackage/Data/com.apple.CoreML/model.mlmodel
          download "$PACKAGE/Data/com.apple.CoreML/weights/weight.bin" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.mlpackage/Data/com.apple.CoreML/weights/weight.bin
          download "$PACKAGE/Manifest.json" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.mlpackage/Manifest.json
          download "$PACKAGE/executorch_debug_handle_mapping.json" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.mlpackage/executorch_debug_handle_mapping.json
          echo '3f7e6f94e5a34bc7ee8aba84aec0f963f56974ab405fbcd334c8e1c3f832bd2c  '"$MODEL_CACHE/visual.onnx" | shasum -a 256 -c -
          echo 'ee267cd64f0f77362670ae0140476ed51ee8c5a761d41636e09997f2fdddcacc  '"$MODEL_CACHE/textual.onnx" | shasum -a 256 -c -
          echo '924691ac288e54409236115652ad4aa250f48203de50a9e4722a6ecd48d6804a  '"$MODEL_CACHE/bpe_simple_vocab_16e6.txt.gz" | shasum -a 256 -c -
          echo 'cba4faede8068da1d0c2a7e56cc9a5af966b2dbcb25c12e40c05ce0da42b7057  '"$PACKAGE/Data/com.apple.CoreML/model.mlmodel" | shasum -a 256 -c -
          echo '9103b327578b2ad7ea82e999565b1956ffce85de1f350d6c7a6244d7a62db2ea  '"$PACKAGE/Data/com.apple.CoreML/weights/weight.bin" | shasum -a 256 -c -
          echo 'b20e697d5518c38b4ea061a93c2fb66850c8f503585fbda5ac101828e12f8564  '"$PACKAGE/Manifest.json" | shasum -a 256 -c -
          echo '21e560657e7abb44a009556ec5564d159836dfedd98b3c5ced5a7aa7da7e7f8c  '"$PACKAGE/executorch_debug_handle_mapping.json" | shasum -a 256 -c -
      - name: Run embedding correctness gate before performance work
        run: |
          .benchmark-rclip/.venv/bin/python benchmarks/coreml/compare_embeddings.py \
            --visual-onnx "$MODEL_CACHE/visual.onnx" --textual-onnx "$MODEL_CACHE/textual.onnx" \
            --coreml-package "$MODEL_CACHE/visual.mlpackage" --rclip-source .benchmark-rclip \
            --golden tests/fixtures/datacomp_golden.json --output "$RUNNER_TEMP/coreml-embeddings.json"
      - name: Materialize pinned corpus
        run: |
          .benchmark-rclip/.venv/bin/python benchmarks/retrieval/prepare_coco.py \
            --output "$RUNNER_TEMP/coco" --count "${{ inputs.corpus_size || '500' }}" --workers 8
          .benchmark-rclip/.venv/bin/python benchmarks/retrieval/generate_fixtures.py \
            --output "$RUNNER_TEMP/coco/images" > "$RUNNER_TEMP/generated-fixtures.json"
      - name: Run repeated CPU ONNX and Core ML end-to-end measurements
        run: |
          mkdir -p "$RUNNER_TEMP/onnx-data" "$RUNNER_TEMP/coreml-data/ViT-B-32-256-datacomp_s34b_b86k"
          cp -R "$MODEL_CACHE/visual.mlpackage" "$RUNNER_TEMP/coreml-data/ViT-B-32-256-datacomp_s34b_b86k/visual.mlpackage"
          for sample in $(seq 1 "${{ inputs.repetitions || '5' }}"); do
            rm -f "$RUNNER_TEMP/onnx-data/db.sqlite3" "$RUNNER_TEMP/coreml-data/db.sqlite3"
            RCLIP_USE_ONNX_ON_MACOS=1 .benchmark-rclip/.venv/bin/python benchmarks/retrieval/run_rclip.py \
              --system rclip-onnx --rclip-source .benchmark-rclip --artifact-dir "$MODEL_CACHE" \
              --data-dir "$RUNNER_TEMP/onnx-data" --corpus-dir "$RUNNER_TEMP/coco/images" \
              --corpus-manifest "$RUNNER_TEMP/coco/corpus.json" \
              --query-manifest benchmarks/retrieval/query_manifest.json \
              --output "$RUNNER_TEMP/onnx-$sample.json"
            .benchmark-rclip/.venv/bin/python benchmarks/retrieval/run_rclip.py \
              --system rclip-coreml --rclip-source .benchmark-rclip --artifact-dir "$MODEL_CACHE" \
              --data-dir "$RUNNER_TEMP/coreml-data" --corpus-dir "$RUNNER_TEMP/coco/images" \
              --corpus-manifest "$RUNNER_TEMP/coco/corpus.json" \
              --query-manifest benchmarks/retrieval/query_manifest.json \
              --output "$RUNNER_TEMP/coreml-$sample.json"
          done
          PYTHONPATH=benchmarks/retrieval .benchmark-rclip/.venv/bin/python \
            benchmarks/retrieval/compare_behavior.py --reference "$RUNNER_TEMP/onnx-1.json" \
            --candidate "$RUNNER_TEMP/coreml-1.json" --output "$RUNNER_TEMP/coreml-behavior.json"
          for sample in $(seq 2 "${{ inputs.repetitions || '5' }}"); do
            PYTHONPATH=benchmarks/retrieval .benchmark-rclip/.venv/bin/python \
              benchmarks/retrieval/compare_behavior.py --reference "$RUNNER_TEMP/coreml-1.json" \
              --candidate "$RUNNER_TEMP/coreml-$sample.json" \
              --output "$RUNNER_TEMP/coreml-repeat-$sample.json"
          done
          .benchmark-rclip/.venv/bin/python benchmarks/coreml/aggregate_performance.py \
            --onnx "$RUNNER_TEMP"/onnx-*.json --coreml "$RUNNER_TEMP"/coreml-[0-9]*.json \
            --embedding-report "$RUNNER_TEMP/coreml-embeddings.json" \
            --behavior-report "$RUNNER_TEMP/coreml-behavior.json" \
            --output "$RUNNER_TEMP/coreml-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-silicon-coreml-report
          path: |
            ${{ runner.temp }}/coreml-embeddings.json
            ${{ runner.temp }}/coreml-behavior.json
            ${{ runner.temp }}/coreml-summary.json
            ${{ runner.temp }}/generated-fixtures.json
          if-no-files-found: warn
          retention-days: 14
