name: Benchmark harness checks
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-harness.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-harness.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s benchmarks/tests -v
      - run: python -m compileall -q benchmarks/harness benchmarks/bench.py
