name: Benchmark harness checks
on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-harness.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest benchmarks/test_bench.py
      - run: python -m py_compile benchmarks/bench.py benchmarks/quality.py benchmarks/aws.py
