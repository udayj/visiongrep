name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.e2e-model-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release
      - uses: actions/cache@v4
        with:
          path: ${{ env.XDG_CACHE_HOME }}/visiongrep/models
          key: e2e-models-${{ hashFiles('src/model/artifacts.rs') }}
      - name: Prepare shared models once before running tests
        run: sh scripts/prepare-test-models.sh
      - name: Run unit, model correctness, and CLI end-to-end tests
        run: cargo test --workspace --all-targets -- --test-threads=1
