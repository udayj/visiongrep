name: Model contract smoke test

on:
  workflow_dispatch:
    inputs:
      include_download_test:
        description: Test a text search with no index or model cache (downloads about 375 MB)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_CACHE: ${{ github.workspace }}/.model-contract-cache
      XDG_CACHE_HOME: ${{ github.workspace }}/.model-runtime-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yurijmikhalevich/rclip
          ref: v3.3.0
          path: .benchmark-rclip
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE }}
          key: model-contract-92c26d60-3f7e6f94-f6ae78a2-ee267cd6-924691ac
      - name: Verify pinned rclip source
        run: test "$(git -C .benchmark-rclip rev-parse HEAD)" = 3dcec2de5e23311473f6fb6433e602aa4f4ca812
      - name: Install isolated reference dependencies
        run: |
          python -m venv "$RUNNER_TEMP/model-contract-venv"
          "$RUNNER_TEMP/model-contract-venv/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.10.0 torchvision==0.25.0
          "$RUNNER_TEMP/model-contract-venv/bin/pip" install \
            numpy==2.1.3 pillow==12.3.0 onnxruntime==1.24.2 open_clip_torch==3.3.0
      - name: Download and verify immutable artifacts
        run: |
          mkdir -p "$MODEL_CACHE"
          download() { if [ ! -f "$1" ]; then curl -L --fail --retry 5 --retry-all-errors -o "$1" "$2"; fi; }
          download "$MODEL_CACHE/open_clip_model.safetensors" \
            https://huggingface.co/laion/CLIP-ViT-B-32-256x256-DataComp-s34B-b86K/resolve/4afec35ffe57a943d569ff7ee888061830164da8/open_clip_model.safetensors
          download "$MODEL_CACHE/visual.onnx" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/visual.onnx
          download "$MODEL_CACHE/visual-int8-e.onnx" \
            https://huggingface.co/udayjjw/visiongrep/resolve/eb7afd0e67f255f36008bbd4b05cfcaeb47504f0/visual-int8-e.onnx
          download "$MODEL_CACHE/textual.onnx" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/ViT-B-32-256-datacomp_s34b_b86k/textual.onnx
          download "$MODEL_CACHE/bpe_simple_vocab_16e6.txt.gz" \
            https://huggingface.co/yurijmikhalevich/rclip-models/resolve/17b9d07433aad73f70d338d8a1c7a4cef83887e0/tokenizer/bpe_simple_vocab_16e6.txt.gz
          download "$MODEL_CACHE/tokenizer.json" \
            https://huggingface.co/laion/CLIP-ViT-B-32-256x256-DataComp-s34B-b86K/resolve/4afec35ffe57a943d569ff7ee888061830164da8/tokenizer.json
          echo '92c26d60d3200ed5ed040dff31a8d19f8140648da8007216c25744c478deef27  '"$MODEL_CACHE/open_clip_model.safetensors" | sha256sum -c -
          echo '3f7e6f94e5a34bc7ee8aba84aec0f963f56974ab405fbcd334c8e1c3f832bd2c  '"$MODEL_CACHE/visual.onnx" | sha256sum -c -
          echo 'f6ae78a288ea20d48c0c6190200aa62dff66f5ccc4c7c2bb7f2d7999b4236ffe  '"$MODEL_CACHE/visual-int8-e.onnx" | sha256sum -c -
          echo 'ee267cd64f0f77362670ae0140476ed51ee8c5a761d41636e09997f2fdddcacc  '"$MODEL_CACHE/textual.onnx" | sha256sum -c -
          echo '924691ac288e54409236115652ad4aa250f48203de50a9e4722a6ecd48d6804a  '"$MODEL_CACHE/bpe_simple_vocab_16e6.txt.gz" | sha256sum -c -
          echo '72ed5c96db5729294468543e4bc75fce14ca63f58e37300290189ba1c1e52b85  '"$MODEL_CACHE/tokenizer.json" | sha256sum -c -
      - name: Verify original OpenCLIP, ONNX, tokenizer, scores, and rankings
        run: |
          "$RUNNER_TEMP/model-contract-venv/bin/python" benchmarks/model_contract/verify_reference.py \
            --openclip-weights "$MODEL_CACHE/open_clip_model.safetensors" \
            --visual-onnx "$MODEL_CACHE/visual.onnx" \
            --textual-onnx "$MODEL_CACHE/textual.onnx" \
            --tokenizer-vocab "$MODEL_CACHE/bpe_simple_vocab_16e6.txt.gz" \
            --rclip-source .benchmark-rclip \
            > "$RUNNER_TEMP/model-contract.json"
      - name: Install shared artifacts for Rust correctness tests
        run: |
          mkdir -p "$XDG_CACHE_HOME/visiongrep/models"
          cp "$MODEL_CACHE/visual-int8-e.onnx" "$XDG_CACHE_HOME/visiongrep/models/datacomp_vision_int8.onnx"
          cp "$MODEL_CACHE/textual.onnx" "$XDG_CACHE_HOME/visiongrep/models/datacomp_text.onnx"
          cp "$MODEL_CACHE/tokenizer.json" "$XDG_CACHE_HOME/visiongrep/models/datacomp_tokenizer.json"
      - name: Run Rust unit, model correctness, and CLI end-to-end tests
        run: cargo test --release --workspace --all-targets -- --test-threads=1
      - name: Run text-query first-download end-to-end test
        if: ${{ inputs.include_download_test }}
        run: >-
          cargo test --release --test text_queries
          text_query_without_index_or_models_downloads_and_caches_artifacts -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-contract-report
          path: ${{ runner.temp }}/model-contract.json
          if-no-files-found: warn
          retention-days: 14
